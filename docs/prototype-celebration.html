<title>动作完成庆祝 · 分级原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0d0a; --panel:#141712; --panel-2:#1b1f19; --line:#2a2f24;
  --ink:#e9f0e2; --muted:#8b957e; --neon:#a3e635; --neon-dim:#6f9b26;
  --gold:#f5c451; --calm:#7d8b74;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(300px,340px) 1fr;gap:22px;
  max-width:1160px;margin:0 auto;padding:clamp(18px,4vw,34px);min-height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr}}

/* ---- control panel ---- */
.panel{display:flex;flex-direction:column;gap:18px}
.brand{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);font-weight:700}
.brand h1{font-size:20px;margin:0;letter-spacing:-.01em}
.brand p{font-size:13px;color:var(--muted);margin:0}
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:flex;gap:12px;align-items:flex-start;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);
  transition:border-color .15s,background .15s}
.tier:hover{background:var(--panel-2)}
.tier[aria-pressed="true"]{border-color:var(--neon);background:var(--panel-2);
  box-shadow:inset 0 0 0 1px var(--neon)}
.tier .id{flex:none;font-weight:800;font-size:12px;font-family:ui-monospace,Menlo,monospace;
  color:var(--neon);width:26px}
.tier .tt{font-size:13.5px;font-weight:650;margin:0 0 1px}
.tier .td{font-size:12px;color:var(--muted);margin:0}
.tier.calm .id{color:var(--calm)}
.toggles{display:flex;gap:10px;flex-wrap:wrap}
.tg{flex:1;min-width:120px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.tg .dot{width:34px;height:19px;border-radius:20px;background:#333a2c;position:relative;transition:background .15s;flex:none}
.tg .dot::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#8b957e;transition:transform .15s,background .15s}
.tg[aria-pressed="true"] .dot{background:var(--neon-dim)}
.tg[aria-pressed="true"] .dot::after{transform:translateX(15px);background:var(--neon)}
.replay{background:var(--neon);color:#10140b;border:none;border-radius:11px;padding:12px;font-weight:750;font-size:14px;cursor:pointer}
.replay:hover{filter:brightness(1.06)}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12.5px}
.spec h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec dl{display:grid;grid-template-columns:66px 1fr;gap:6px 10px;margin:0}
.spec dt{color:var(--muted)}
.spec dd{margin:0}
.chan{display:flex;gap:5px;margin-top:10px}
.chan span{flex:1;text-align:center;font-size:11px;padding:5px 0;border-radius:7px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.chan span.on{color:#10140b;background:var(--neon);border-color:var(--neon);font-weight:700}
.foot{font-size:11px;color:var(--muted);line-height:1.6}

/* ---- stage (the celebration screen) ---- */
.stage-wrap{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;aspect-ratio:9/12;max-height:74vh;margin:0 auto;width:100%;max-width:440px;
  background:#000;border-radius:26px;overflow:hidden;border:1px solid #23271d;
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 6px #05060400}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stagecontent{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.word{font-size:clamp(34px,9vw,58px);font-weight:800;letter-spacing:-.02em;color:var(--neon);
  opacity:0;transform:scale(.7);text-wrap:balance;line-height:1.05;
  text-shadow:0 0 24px rgba(163,230,53,.5)}
.badge{opacity:0;transform:translateY(8px) scale(.9);font-size:12px;font-weight:800;letter-spacing:.1em;
  padding:5px 12px;border-radius:999px;background:var(--gold);color:#2a1e00}
.subline{opacity:0;transform:translateY(10px);font-size:16px;color:#dfe7d6;max-width:22ch;font-weight:500}
.tap{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s}
.idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3f4736;font-size:14px;letter-spacing:.05em}
.stage[data-playing="true"] .idle{display:none}
@media(prefers-reduced-motion:reduce){.word,.badge,.subline{transition:none!important}}
</style>

<div class="app">
  <div class="panel">
    <div class="brand">
      <span class="eyebrow">Body Park · Completion Celebration</span>
      <h1>动作完成庆祝 · 分级原型</h1>
      <p>点档位查看 UI / 动效 / 洒花 / 音效 / 人声的差异。声音为浏览器现场合成的占位效果。</p>
    </div>

    <div class="tiers" id="tiers"></div>

    <button class="replay" id="replay">▸ 重放当前档</button>

    <div class="toggles">
      <button class="tg" id="tgSound" aria-pressed="true"><span>音效</span><span class="dot"></span></button>
      <button class="tg" id="tgVoice" aria-pressed="true"><span>人声</span><span class="dot"></span></button>
    </div>

    <div class="spec" id="spec"></div>

    <p class="foot">恒定层（一致性）：荧光绿×黑、Complete 字标、洒花基础样式、声音签名、教练人格。<br>
    变化层（惊喜）：强度/规模随档变，鼓励话术每次洗牌换。</p>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage" data-playing="false">
      <canvas id="cv"></canvas>
      <div class="idle">选择档位或点「重放」</div>
      <div class="stagecontent">
        <div class="word" id="word">Complete</div>
        <div class="badge" id="badge">NEW PB</div>
        <div class="subline" id="subline"></div>
      </div>
      <div class="tap" id="tap">点击继续 →</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

  // ---------- tier config ----------
  const TIERS = {
    T0:{id:"T0",intent:"SET_ACK",name:"记录·安抚",desc:"一组 · 打断 / 未达标",calm:true,
        word:"已记录",color:"var(--calm)",badge:null,confetti:0,fullscreen:false,dur:1000,
        sfx:"soft",motion:"极简淡入 + 勾选，不洒花",voiceName:"平静肯定",
        lines:["这组先记下，喘口气~","没关系，稳住节奏，下一组来。","记上了，休息一下再战。","尽力就好，缓一缓。"]},
    T1:{id:"T1",intent:"SET_DONE",name:"完成",desc:"一组 · 达标",
        word:"Complete",color:"var(--neon)",badge:null,confetti:60,fullscreen:false,dur:1300,
        sfx:"arp",motion:"字标 scale-in + 小粒子 pop",voiceName:"普通鼓励",
        lines:["这组稳了，喘口气~","完成！放松一下肩膀。","节奏不错，继续保持。","好，拿下这组，歇会儿。"]},
    T2:{id:"T2",intent:"SET_HIGHLIGHT",name:"高光",desc:"一组 · 破纪录 / 优秀",
        word:"Complete",color:"var(--neon)",badge:"NEW PB",confetti:150,fullscreen:false,dur:1800,
        sfx:"sparkle",motion:"更大爆发 + 金色点缀 + 徽章动画",voiceName:"破纪录 / 优秀",
        lines:["破纪录啦！为你鼓掌。","又稳又准，这组能打！","新高度，超越了自己！","这组质量很高，动作标准！"]},
    T3:{id:"T3",intent:"COURSE_DONE",name:"结课",desc:"整节课 · 完成",
        word:"Course Complete",color:"var(--neon)",badge:null,confetti:260,fullscreen:true,dur:3000,
        sfx:"applause",motion:"全屏 + 持续洒花 + 数据揭示",voiceName:"结课鼓励",
        lines:["全部完成，今天很棒！","这节课拿下了，为你骄傲。","收工！坚持到底就是胜利。","练完啦，给自己鼓个掌。"]},
    T4:{id:"T4",intent:"COURSE_GRAND",name:"满贯",desc:"整节课 · 多PB / 高完成",
        word:"Perfect Course",color:"var(--gold)",badge:"PERFECT",confetti:420,fullscreen:true,dur:3500,
        sfx:"grand",motion:"全屏加强 + 分层 + 更长",voiceName:"史诗祝贺",
        lines:["满贯表现，今天封神！","全程高质量，太强了！","完美收官，这就是最好的你。"]},
  };
  const ORDER=["T0","T1","T2","T3","T4"];
  let current="T1";
  let soundOn=true, voiceOn=true;

  // ---------- shuffle-bag (防重复) ----------
  const bags={};
  function draw(tier){
    const pool=TIERS[tier].lines;
    if(!bags[tier]||bags[tier].length===0){
      const idx=pool.map((_,i)=>i);
      for(let i=idx.length-1;i>0;i--){const j=Math.floor(( (Math.sin(Date.now()*i*0.7)+1)/2 )*(i+1))%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]];}
      bags[tier]=idx;
    }
    return pool[bags[tier].shift()];
  }

  // ---------- audio (Web Audio 现场合成占位) ----------
  let ac=null,master=null;
  function ensureAudio(){ if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);} if(ac.state==="suspended")ac.resume(); }
  function tone(freq,start,dur,opt){opt=opt||{};const partials=opt.partials||[[1,1]];const g0=opt.gain||0.25;const type=opt.type||"sine";
    partials.forEach(function(p){const o=ac.createOscillator();const g=ac.createGain();o.type=type;o.frequency.value=freq*p[0];
      const t0=ac.currentTime+start;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(g0*p[1],t0+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);});}
  const MAR=[[1,1],[3.9,0.3],[9.2,0.1]], BELL=[[1,1],[2.76,0.4],[5.4,0.2]];
  function applause(start,dur,gain){const n=Math.floor(ac.sampleRate*dur);const b=ac.createBuffer(1,n,ac.sampleRate);const d=b.getChannelData(0);let prev=0;
    for(let i=0;i<n;i++){const pos=i/n;const swell=Math.min(1,0.3+pos)*Math.exp(-Math.pow(pos-0.55,2)/0.1);const w=Math.random()*2-1;const hp=w-prev;prev=w;
      // 随机拍点密度
      const clap=(Math.random()<0.04)?(Math.random()*1.5):0.25;d[i]=hp*swell*clap;}
    const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=gain;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=2200;f.Q.value=0.6;
    s.connect(f);f.connect(g);g.connect(master);s.start(ac.currentTime+start);}
  function playSfx(kind){ if(!soundOn)return; ensureAudio();
    switch(kind){
      case"soft": tone(392,0,0.18,{partials:[[1,1],[2,0.15]],gain:0.12}); tone(392,0.09,0.16,{partials:[[1,1]],gain:0.1}); break;
      case"arp": [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.12,0.5,{partials:MAR,gain:0.22})); [523.25,659.25,783.99].forEach(f=>tone(f,0.42,0.9,{partials:BELL,gain:0.12})); break;
      case"sparkle": [523.25,783.99,1046.5].forEach((f,i)=>tone(f,i*0.11,0.4,{partials:MAR,gain:0.22})); [2093,2637].forEach((f,i)=>tone(f,0.42+i*0.08,0.5,{partials:[[1,1],[2,0.4]],gain:0.14})); break;
      case"applause": applause(0.05,2.2,0.5); [1046.5,1318.5].forEach((f,i)=>tone(f,0.05+i*0.1,1.1,{partials:BELL,gain:0.14})); break;
      case"grand": [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.13,0.6,{partials:[[1,0.5],[2,0.25],[3,0.16]],type:"sawtooth",gain:0.12})); applause(0.5,2.0,0.45); [2093,2637,3136].forEach((f,i)=>tone(f,0.7+i*0.1,0.4,{partials:[[1,1],[2,0.4]],gain:0.12})); break;
    }
  }
  function speak(text){ if(!voiceOn||!("speechSynthesis"in window))return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=1.05; u.pitch=1.05;
    const vs=speechSynthesis.getVoices(); const zh=vs.find(v=>/zh|Chinese/i.test(v.lang+v.name)); if(zh)u.voice=zh; speechSynthesis.speak(u);}catch(e){} }

  // ---------- confetti ----------
  const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  let parts=[], raf=null, W=0,H=0;
  function size(){const r=cv.getBoundingClientRect();W=cv.width=r.width*devicePixelRatio;H=cv.height=r.height*devicePixelRatio;}
  const COLORS={neon:"#a3e635",white:"#f2f7ea",gold:"#f5c451",dim:"#6f9b26"};
  function spawn(n,gold){ if(reduce)n=Math.min(n,30);
    for(let i=0;i<n;i++){parts.push({x:W*(0.5+(Math.random()-0.5)*0.5),y:H*0.42,
      vx:(Math.random()-0.5)*10*devicePixelRatio,vy:(Math.random()*-12-4)*devicePixelRatio,
      g:0.34*devicePixelRatio,s:(3+Math.random()*4)*devicePixelRatio,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,
      c:gold&&Math.random()<0.45?COLORS.gold:(Math.random()<0.5?COLORS.neon:(Math.random()<0.5?COLORS.white:COLORS.dim)),life:1});}
    if(!raf)loop();
  }
  function loop(){raf=requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=0.006;
      if(p.y>H+20||p.life<=0){parts.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.5);ctx.restore();}
    if(parts.length===0){cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,W,H);} }

  // ---------- play a tier ----------
  const stage=document.getElementById("stage"),word=document.getElementById("word"),badge=document.getElementById("badge"),
        subline=document.getElementById("subline"),tap=document.getElementById("tap");
  let endTimer=null;
  function anim(el,styles,delay){setTimeout(()=>{Object.assign(el.style,styles)},delay);}
  function play(tier){
    const t=TIERS[tier]; size(); clearTimeout(endTimer); parts=[]; if(raf){cancelAnimationFrame(raf);raf=null;} ctx.clearRect(0,0,W,H);
    stage.dataset.playing="true";
    // reset
    word.style.transition="none";badge.style.transition="none";subline.style.transition="none";
    word.style.opacity=0;word.style.transform="scale(.7)";badge.style.opacity=0;badge.style.transform="translateY(8px) scale(.9)";
    subline.style.opacity=0;subline.style.transform="translateY(10px)";tap.style.opacity=0;
    word.textContent=t.word;word.style.color=t.color;
    badge.style.display=t.badge?"block":"none";if(t.badge)badge.textContent=t.badge;
    const line=draw(tier);
    // t0: sfx + word in + confetti
    playSfx(t.sfx);
    requestAnimationFrame(()=>{ word.style.transition="opacity .4s ease, transform .5s cubic-bezier(.2,1.3,.4,1)";
      word.style.opacity=1;word.style.transform="scale(1)"; });
    if(t.confetti)spawn(t.confetti,tier==="T2"||tier==="T4");
    if(t.badge)anim(badge,{transition:"opacity .3s, transform .4s cubic-bezier(.2,1.4,.4,1)",opacity:1,transform:"translateY(0) scale(1)"},260);
    // t+300: voice + subline
    setTimeout(()=>{subline.textContent=line;subline.style.transition="opacity .4s, transform .4s";subline.style.opacity=1;subline.style.transform="translateY(0)";speak(line);},300);
    // sustained confetti for course tiers
    if(t.confetti>=260){setTimeout(()=>spawn(Math.floor(t.confetti*0.5),tier==="T4"),700);setTimeout(()=>spawn(Math.floor(t.confetti*0.4),tier==="T4"),1400);}
    // end
    if(t.fullscreen){setTimeout(()=>{tap.style.opacity=1},900);}
    endTimer=setTimeout(()=>{ stage.dataset.playing="false"; }, t.dur+400);
    renderSpec(tier);
  }

  // ---------- UI build ----------
  const tiersEl=document.getElementById("tiers");
  ORDER.forEach(k=>{const t=TIERS[k];const b=document.createElement("button");b.className="tier"+(t.calm?" calm":"");b.setAttribute("aria-pressed",k===current);
    b.innerHTML='<span class="id">'+t.id+'</span><span><p class="tt">'+t.name+' · '+t.intent+'</p><p class="td">'+t.desc+'</p></span>';
    b.onclick=()=>{current=k;[...tiersEl.children].forEach((c,i)=>c.setAttribute("aria-pressed",ORDER[i]===k));play(k);};
    tiersEl.appendChild(b);});
  document.getElementById("replay").onclick=()=>play(current);
  const tgS=document.getElementById("tgSound"),tgV=document.getElementById("tgVoice");
  tgS.onclick=()=>{soundOn=!soundOn;tgS.setAttribute("aria-pressed",soundOn)};
  tgV.onclick=()=>{voiceOn=!voiceOn;tgV.setAttribute("aria-pressed",voiceOn)};
  stage.onclick=()=>{if(stage.dataset.playing==="true"){stage.dataset.playing="false";clearTimeout(endTimer);if(raf){cancelAnimationFrame(raf);raf=null;}parts=[];ctx.clearRect(0,0,W,H);speechSynthesis&&speechSynthesis.cancel();}};

  function renderSpec(tier){const t=TIERS[tier];const spec=document.getElementById("spec");
    spec.innerHTML='<h3>'+t.id+' · '+t.name+' 规格</h3>'+
      '<dl><dt>UI 文字</dt><dd>'+t.word+'</dd>'+
      '<dt>动效/洒花</dt><dd>'+t.motion+'</dd>'+
      '<dt>音效</dt><dd>'+t.sfx+'</dd>'+
      '<dt>人声</dt><dd>'+t.voiceName+'（洗牌换）</dd>'+
      '<dt>时长</dt><dd>'+(t.dur/1000).toFixed(1)+'s · '+(t.fullscreen?"全屏·点击继续":"overlay·自动过")+'</dd></dl>'+
      '<div class="chan"><span class="on">UI</span><span class="'+(t.confetti?"on":"")+'">洒花</span><span class="'+(soundOn?"on":"")+'">音效</span><span class="'+(voiceOn?"on":"")+'">人声</span></div>';
  }
  window.addEventListener("resize",size);
  if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=()=>{};}
  renderSpec(current); size();
})();
</script>
