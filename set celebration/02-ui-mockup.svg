<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#12160e"/><stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1240" height="720" fill="#0b0d0a"/>
  <text x="60" y="56" fill="#a3e635" font-size="13" letter-spacing="3" font-weight="700">BODY PARK · SET CELEBRATION · UI 设计图</text>
  <text x="60" y="82" fill="#8b957e" font-size="14">三行层级：D1 范围(上·小) / D2 状态(中·最大·主视觉) / D3 表现(下·独立徽章) · 荧光绿×黑</text>

  <!-- ============ 圆屏 T2：本组·已完成·新纪录 ============ -->
  <g transform="translate(120,150)">
    <circle cx="200" cy="200" r="205" fill="none" stroke="#1a1e15" stroke-width="10"/>
    <circle cx="200" cy="200" r="200" fill="url(#glow)"/>
    <!-- 安全区参考 -->
    <rect x="60" y="60" width="280" height="280" rx="6" fill="none" stroke="#2a2f24" stroke-width="1" stroke-dasharray="4 5"/>
    <!-- PB 金色光环 -->
    <circle cx="200" cy="200" r="194" fill="none" stroke="#f5c451" stroke-width="3" opacity="0.85"/>
    <!-- 撒花 -->
    <g>
      <rect x="120" y="96" width="8" height="4" fill="#a3e635" transform="rotate(20 124 98)"/>
      <rect x="250" y="86" width="8" height="4" fill="#f5c451" transform="rotate(-30 254 88)"/>
      <rect x="300" y="140" width="7" height="4" fill="#f2f7ea" transform="rotate(45 303 142)"/>
      <rect x="90" y="150" width="7" height="4" fill="#f5c451" transform="rotate(-15 93 152)"/>
      <rect x="330" y="220" width="8" height="4" fill="#a3e635" transform="rotate(60 334 222)"/>
      <rect x="80" y="240" width="7" height="4" fill="#f2f7ea" transform="rotate(30 83 242)"/>
      <rect x="150" y="300" width="8" height="4" fill="#f5c451" transform="rotate(-40 154 302)"/>
      <rect x="270" y="300" width="7" height="4" fill="#a3e635" transform="rotate(15 273 302)"/>
    </g>
    <!-- 三行 -->
    <text x="200" y="150" text-anchor="middle" fill="#a9c47e" font-size="24" font-weight="650">本组</text>
    <text x="200" y="222" text-anchor="middle" fill="#a3e635" font-size="62" font-weight="800" letter-spacing="-1" filter="url(#soft)" opacity="0.5">已完成</text>
    <text x="200" y="220" text-anchor="middle" fill="#a3e635" font-size="62" font-weight="800" letter-spacing="-1">已完成</text>
    <rect x="153" y="252" width="94" height="30" rx="15" fill="#f5c451"/>
    <text x="200" y="273" text-anchor="middle" fill="#2a1e00" font-size="14" font-weight="800" letter-spacing="1">新纪录</text>
  </g>
  <text x="320" y="600" text-anchor="middle" fill="#8b957e" font-size="13">设备端 · 466×466 圆 · T2 高光（本组 / 已完成 / 新纪录）</text>
  <text x="320" y="622" text-anchor="middle" fill="#5f6b52" font-size="12">音效：当当 + 啪啪叠层 · 金色光环 · 人声单独播不上屏</text>

  <!-- ============ 圆屏 T0：本组·已记录 ============ -->
  <g transform="translate(600,180)">
    <circle cx="160" cy="160" r="165" fill="none" stroke="#1a1e15" stroke-width="8"/>
    <circle cx="160" cy="160" r="160" fill="url(#glow)"/>
    <g opacity="0.9">
      <rect x="90" y="80" width="6" height="3" fill="#a3e635" transform="rotate(20 93 81)"/>
      <rect x="230" y="100" width="6" height="3" fill="#6f9b26" transform="rotate(-30 233 101)"/>
      <rect x="110" y="230" width="6" height="3" fill="#f2f7ea" transform="rotate(40 113 231)"/>
      <rect x="220" y="230" width="6" height="3" fill="#a3e635" transform="rotate(-20 223 231)"/>
    </g>
    <text x="160" y="120" text-anchor="middle" fill="#a9c47e" font-size="20" font-weight="650">本组</text>
    <text x="160" y="182" text-anchor="middle" fill="#a3e635" font-size="50" font-weight="800" letter-spacing="-1">已记录</text>
  </g>
  <text x="760" y="580" text-anchor="middle" fill="#8b957e" font-size="13">T0 · 本组 / 已记录（未达标）</text>
  <text x="760" y="602" text-anchor="middle" fill="#5f6b52" font-size="12">仍撒花、仍庆祝，只是不叠 PB 层 · 音效：咚咚(暖)</text>

  <!-- ============ 手机端：全部·已完成·新纪录 ============ -->
  <g transform="translate(980,150)">
    <rect x="0" y="0" width="200" height="410" rx="34" fill="#000" stroke="#23271d" stroke-width="1"/>
    <rect x="61" y="16" width="78" height="6" rx="3" fill="#1a1e15"/>
    <g>
      <rect x="40" y="70" width="9" height="5" fill="#f5c451" transform="rotate(20 44 72)"/>
      <rect x="150" y="60" width="9" height="5" fill="#a3e635" transform="rotate(-30 154 62)"/>
      <rect x="30" y="150" width="8" height="5" fill="#f2f7ea" transform="rotate(40 34 152)"/>
      <rect x="165" y="150" width="8" height="5" fill="#f5c451" transform="rotate(-15 169 152)"/>
      <rect x="60" y="300" width="9" height="5" fill="#a3e635" transform="rotate(30 64 302)"/>
      <rect x="140" y="310" width="8" height="5" fill="#f2f7ea" transform="rotate(-40 144 312)"/>
    </g>
    <text x="100" y="170" text-anchor="middle" fill="#a9c47e" font-size="22" font-weight="650">全部</text>
    <text x="100" y="235" text-anchor="middle" fill="#f5c451" font-size="46" font-weight="800" letter-spacing="-1">已完成</text>
    <rect x="55" y="258" width="90" height="28" rx="14" fill="#f5c451"/>
    <text x="100" y="277" text-anchor="middle" fill="#2a1e00" font-size="13" font-weight="800" letter-spacing="1">新纪录</text>
    <text x="100" y="380" text-anchor="middle" fill="#5f6b52" font-size="11">点击继续 →</text>
  </g>
  <text x="1080" y="590" text-anchor="middle" fill="#8b957e" font-size="13">手机 App · 方屏</text>
  <text x="1080" y="612" text-anchor="middle" fill="#5f6b52" font-size="12">空间更足，字标更大</text>

  <!-- 图注 -->
  <g transform="translate(60,660)">
    <text x="0" y="0" fill="#8b957e" font-size="12">一致(恒定层)：荧光绿×黑 · 字标字体 · 撒花样式 · 声音签名 · 教练人声人格</text>
    <text x="0" y="20" fill="#8b957e" font-size="12">差异(组合层)：范围/状态词元 · 表现徽章 · 音效叠层(咚咚/当当/啪啪) · 撒花强度 · 圆屏光环 vs 手机全屏</text>
  </g>
</svg>
