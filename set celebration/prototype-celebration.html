<title>动作完成庆祝 · 解耦组合原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0d0a; --panel:#141712; --panel-2:#1b1f19; --line:#2a2f24;
  --ink:#e9f0e2; --muted:#8b957e; --neon:#a3e635; --neon-dim:#6f9b26; --gold:#f5c451; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:minmax(310px,360px) 1fr;gap:22px;max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,34px);min-height:100vh}
@media(max-width:880px){.app{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:15px}
.brand{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon);font-weight:700}
.brand h1{font-size:19px;margin:0}
.brand p{font-size:12.5px;color:var(--muted);margin:0}
.dim{display:flex;flex-direction:column;gap:6px}
.dim .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
.seg.wrap{flex-wrap:wrap}
.seg button{flex:1;min-width:52px;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:8px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--neon);color:#10140b}
.seg.gold button[aria-pressed="true"]{background:var(--gold);color:#2a1e00}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggles{display:flex;gap:10px}
.tg{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.tg .dot{width:34px;height:19px;border-radius:20px;background:#333a2c;position:relative;flex:none}
.tg .dot::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#8b957e;transition:transform .15s,background .15s}
.tg[aria-pressed="true"] .dot{background:var(--neon-dim)}
.tg[aria-pressed="true"] .dot::after{transform:translateX(15px);background:var(--neon)}
.replay{background:var(--neon);color:#10140b;border:none;border-radius:11px;padding:12px;font-weight:750;font-size:14px;cursor:pointer}
.replay:hover{filter:brightness(1.06)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer}
.presets button:hover{color:var(--ink);border-color:var(--neon-dim)}
.spec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12.5px}
.spec h3{margin:0 0 9px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spec dl{display:grid;grid-template-columns:56px 1fr;gap:6px 10px;margin:0}
.spec dt{color:var(--muted)}.spec dd{margin:0}
.spec code{color:var(--neon);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.foot{font-size:11px;color:var(--muted);line-height:1.6}

.stage-col{display:flex;flex-direction:column;gap:12px;align-items:center}
.frame{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:12px;color:var(--muted)}.cap b{color:var(--ink);font-weight:600}
.stage{position:relative;background:#000;overflow:hidden;cursor:pointer}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stagecontent{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.idle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#3f4736;font-size:13px}
.stage[data-playing="true"] .idle{display:none}
.badge{opacity:0;transform:translateY(8px) scale(.9);font-size:12px;font-weight:800;letter-spacing:.12em;padding:5px 13px;border-radius:999px;background:var(--gold);color:#2a1e00;margin-top:4px}
.badge.great{background:var(--neon);color:#10140b}
/* 三行堆叠：D1 范围(上·小) / D2 状态(中·最大) / D3 表现徽章(下) */
.l-scope{opacity:0;transform:translateY(8px);font-weight:650;letter-spacing:.02em;color:#a9c47e;line-height:1}
.l-state{opacity:0;transform:scale(.7);font-weight:800;letter-spacing:-.02em;color:var(--neon);line-height:1.02;text-wrap:balance;text-shadow:0 0 28px rgba(163,230,53,.55)}
.tap{position:absolute;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:0;transition:opacity .3s}
.ring{position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(163,230,53,0);pointer-events:none}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(163,230,53,.55), rgba(163,230,53,0) 60%);opacity:0;pointer-events:none}
.stage.round{width:min(466px,86vw);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 10px #0f120c,0 26px 70px rgba(0,0,0,.6)}
.stage.round canvas{border-radius:50%}
.stage.round .stagecontent{padding:0 13%;gap:7px}
.stage.round .l-scope{font-size:clamp(17px,4.6vw,26px)}
.stage.round .l-state{font-size:clamp(42px,12vw,64px)}
.stage.round .tap{bottom:11%}
.stage.phone{width:min(292px,72vw);aspect-ratio:9/19;border-radius:30px;border:1px solid #23271d;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.stage.phone .stagecontent{padding:0 24px;gap:10px}
.stage.phone .l-scope{font-size:clamp(24px,6.5vw,32px)}
.stage.phone .l-state{font-size:clamp(54px,16vw,78px)}
.stage.phone .ring{display:none}
.stage.phone .tap{bottom:26px}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:78px;height:6px;border-radius:6px;background:#1a1e15;z-index:3}
.stage.round .notch{display:none}
@media(prefers-reduced-motion:reduce){.l-scope,.l-state,.badge,.ring{transition:none!important}}
</style>

<div class="app">
  <div class="panel">
    <div class="brand">
      <span class="eyebrow">Body Park · 解耦组合模型</span>
      <h1>完成庆祝 · 三维组合</h1>
      <p>文字 = 范围+状态；表现走独立徽章；音效 = 基础音+新纪录叠层。人声单独播、不上屏。</p>
    </div>

    <div class="dim"><span class="lab">语言 Language</span>
      <div class="seg" id="segLang"><button data-v="zh" aria-pressed="true">中文</button><button data-v="en">English</button></div></div>

    <div class="dim"><span class="lab">D1 范围 Scope</span>
      <div class="seg" id="segScope"><button data-v="set" aria-pressed="true">本组</button><button data-v="action">本动作</button><button data-v="course">全部/课程</button></div></div>

    <div class="row2">
      <div class="dim"><span class="lab">D2 状态 State</span>
        <div class="seg" id="segState"><button data-v="logged">已记录</button><button data-v="done" aria-pressed="true">已完成</button></div></div>
      <div class="dim"><span class="lab">D3 表现 Perf</span>
        <div class="seg gold" id="segPerf"><button data-v="none" aria-pressed="true">无</button><button data-v="great">很棒</button><button data-v="pb">新纪录</button></div></div>
    </div>

    <button class="replay" id="replay">▸ 组合并播放</button>

    <div class="dim"><span class="lab">快捷组合</span>
      <div class="presets" id="presets"></div></div>

    <div class="row2">
      <div class="dim"><span class="lab">形态</span>
        <div class="seg" id="segMode"><button data-v="round" aria-pressed="true">设备圆</button><button data-v="phone">手机</button></div></div>
      <div class="toggles">
        <button class="tg" id="tgSound" aria-pressed="true"><span>音效</span><span class="dot"></span></button>
        <button class="tg" id="tgVoice" aria-pressed="true"><span>人声</span><span class="dot"></span></button>
      </div>
    </div>

    <div class="spec" id="spec"></div>
    <p class="foot">解耦：文字/徽章/音效/人声/洒花各按维度独立取值再组合，<b>不穷举</b>。默认全部庆祝（含"已记录"）；新纪录只多叠一层「啪啪」与金色。<br>本界面是<b>独立原子模块</b>：只演完这一次庆祝，<b>不决定跳转</b>——演完由宿主业务接手。</p>
  </div>

  <div class="stage-col">
    <div class="frame">
      <div class="stage round" id="stage" data-playing="false">
        <div class="notch"></div>
        <canvas id="cv"></canvas>
        <div class="flash" id="flash"></div>
        <div class="ring" id="ring"></div>
        <div class="idle">调左侧维度 → 点「组合并播放」</div>
        <div class="stagecontent">
          <div class="l-scope" id="lineScope">本组</div>
          <div class="l-state" id="lineState">已完成</div>
          <div class="badge" id="badge">新纪录</div>
        </div>
        <div class="tap" id="tap">点击继续 →</div>
      </div>
      <div class="cap" id="cap">设备端 · <b>466 × 466</b> 纯圆屏</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  // ---------- i18n 词元表（解耦：各自翻译，按语言模板拼） ----------
  const I18N={
    zh:{ scope:{set:"本组",action:"本动作",course:"全部"}, state:{logged:"已记录",done:"已完成"},
         badge:{great:"很棒",pb:"新纪录"}, compose:(s,st)=>s+st },
    en:{ scope:{set:"Set",action:"Exercise",course:"Course"}, state:{logged:"Logged",done:"Complete"},
         badge:{great:"GREAT",pb:"NEW PB"}, compose:(s,st)=>s+" "+st },
  };
  // 人声（预生成、不上屏）：节选自 04-voice-copy.md 的分组文案，按 状态×表现 粗分池
  const VOICE={
    zh:{ ack:["这组先记下，调整呼吸下组再战。","没关系，稳住节奏，坚持就很棒。","尽力就好，喘口气我们继续。","先记一笔，慢慢来，别着急。"],
         done:["这组稳稳拿下，节奏保持得很好。","完成！动作很到位，喘口气继续。","干得漂亮，这组质量在线，保持住。","又拿下一组，稳扎稳打，很好。","搞定这组，深呼吸，准备下一组。"],
         great:["这组几乎组组到位，控制力很棒。","又稳又准，动作标准得像教科书。","质量很高，这组打得非常漂亮。","稳定又精准，这一组相当出色。"],
         pb:["破纪录啦，你刚刚超越了自己！","新高度达成，这一组值得记住！","又刷新纪录了，今天状态在线！","超越自我，这份突破值得骄傲！"],
         course:["全部完成，今天你坚持到底了！","练完啦，这份努力都算数，真棒。","整节课拿下，为你的坚持骄傲！","收工！从头到尾都很稳，鼓个掌。"] },
    en:{ ack:["Logged — breathe and reset for the next one.","It's okay, hold your rhythm — keep at it.","Give what you can, breathe, let's continue.","Marked down — no rush, take your time."],
         done:["Nice — that set was smooth and steady.","Done! Great form, take a breath.","Solid work, quality's on point — keep it up.","Another set down, steady as you go.","That's a wrap, breathe and reset."],
         great:["Almost every rep on point — great control.","Steady and precise — textbook form.","High quality — that set was beautiful.","Steady and sharp — outstanding work."],
         pb:["New record — you just beat yourself!","New high — worth remembering!","Another record broken, you're dialed in!","Beyond your limit — be proud of that!"],
         course:["All done — you saw it through today!","Workout complete — every effort counts. Great job.","Whole session done — proud of your grit!","That's a wrap — steady throughout. Take a bow."] }
  };

  let lang="zh",scope="set",state="done",perf="none",mode="round",soundOn=true,voiceOn=true;

  // ---------- audio ----------
  let ac=null,master=null;
  function ensureAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);}if(ac.state==="suspended")ac.resume();}
  function tone(f,s,d,o){o=o||{};const P=o.partials||[[1,1]],g0=o.gain||0.25,ty=o.type||"sine";P.forEach(function(p){const osc=ac.createOscillator(),g=ac.createGain();osc.type=ty;osc.frequency.value=f*p[0];const t0=ac.currentTime+s;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(g0*p[1],t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);osc.connect(g);g.connect(master);osc.start(t0);osc.stop(t0+d+0.05);});}
  const MAR=[[1,1],[3.9,0.3],[9.2,0.1]],BELL=[[1,1],[2.76,0.4],[5.4,0.2]];
  function clapLayer(s,d,gain){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),dt=b.getChannelData(0);let prev=0;for(let i=0;i<n;i++){const pos=i/n,env=Math.exp(-pos*6),w=Math.random()*2-1,hp=w-prev;prev=w;const clap=(Math.random()<0.06)?(Math.random()*1.6):0.2;dt[i]=hp*env*clap;}const src=ac.createBufferSource();src.buffer=b;const g=ac.createGain();g.gain.value=gain;const fl=ac.createBiquadFilter();fl.type="bandpass";fl.frequency.value=2000;fl.Q.value=0.7;src.connect(fl);fl.connect(g);g.connect(master);src.start(ac.currentTime+s);}
  // 基础音：按 范围×状态 组合（不穷举，用函数生成）
  function baseSfx(){
    if(state==="logged"){ // 咚咚：暖、双击、仍愉悦
      tone(294,0,0.2,{partials:[[1,1],[2,0.2]],gain:0.2}); tone(294,0.11,0.2,{partials:[[1,1],[2,0.2]],gain:0.18}); return;
    }
    // done：当当，范围越大越隆重
    if(scope==="set"){ [523.25,659.25].forEach((f,i)=>tone(f,i*0.12,0.5,{partials:MAR,gain:0.22})); }
    else if(scope==="action"){ [523.25,659.25,783.99].forEach((f,i)=>tone(f,i*0.12,0.55,{partials:MAR,gain:0.22})); [523.25,659.25].forEach(f=>tone(f,0.42,0.8,{partials:BELL,gain:0.1})); }
    else{ [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,0,1.3,{partials:BELL,gain:0.13})); [1318.5].forEach(f=>tone(f,0.2,1.0,{partials:BELL,gain:0.1})); } // 课程：和弦钟鸣
  }
  // 叠加层：新纪录 → 啪啪
  function pbLayer(){ clapLayer(0.15,0.5,0.5); clapLayer(0.38,0.6,0.45); [1568,2093].forEach((f,i)=>tone(f,0.2+i*0.08,0.4,{partials:[[1,1],[2,0.4]],gain:0.1})); }
  function playSfx(){ if(!soundOn)return; ensureAudio(); baseSfx(); if(perf==="pb")pbLayer(); }
  // 蓄力上扬音（anticipation riser）：音高由低升高，落在爆发瞬间
  function riser(dur){ ensureAudio(); const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;
    o.type="sine"; o.frequency.setValueAtTime(200,t0); o.frequency.exponentialRampToValueAtTime(640,t0+Math.max(0.08,dur));
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.09,t0+dur*0.9+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur+0.06);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.1); }
  function speak(){ if(!voiceOn||!("speechSynthesis"in window))return; let pool;
    if(perf==="pb")pool=VOICE[lang].pb; else if(perf==="great")pool=VOICE[lang].great;
    else if(scope==="course")pool=VOICE[lang].course; else pool=(state==="logged")?VOICE[lang].ack:VOICE[lang].done;
    const t=pool[Math.floor(((Math.sin(Date.now())+1)/2)*pool.length)%pool.length];
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=(lang==="zh")?"zh-CN":"en-US";u.rate=1.05;u.pitch=1.05;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith(lang==="zh"?"zh":"en"));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
  }

  // ---------- confetti（升级：飘摆翻转 + 多形状 + 分级调色 + 彩纸炮） ----------
  const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  let parts=[],raf=null,W=0,H=0;const DPR=devicePixelRatio||1;
  function size(){const r=cv.getBoundingClientRect();W=cv.width=Math.max(1,r.width*DPR);H=cv.height=Math.max(1,r.height*DPR);}
  const Cc={neon:"#a3e635",white:"#f2f7ea",gold:"#f5c451",dim:"#6f9b26"};
  const FESTIVE=["#f2856b","#6bd6e6","#c98bdb"]; // 大场合点缀的低饱和多彩
  const SHAPES=["rect","rect","circle","streamer","spark"];
  // 分级调色板：普通=品牌色；很棒=更亮；PB=加金；结课/满贯=加多彩
  function palette(){let p=[Cc.neon,Cc.white,Cc.dim];
    if(perf==="great")p=[Cc.neon,Cc.white,Cc.neon,Cc.gold];
    if(perf==="pb")p=[Cc.gold,Cc.neon,Cc.white,Cc.gold];
    if(scope==="course")p=p.concat(FESTIVE.slice(0,(perf==="pb")?3:2));
    return p;}
  function mkPart(x,y,vx,vy,pal){return{x,y,vx,vy,g:0.30*DPR,drag:0.992,
    s:(3.5+Math.random()*4)*DPR,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.5,
    sp:Math.random()*6.28,sa:(0.6+Math.random()*1.4)*DPR,ss:0.13+Math.random()*0.18,
    shape:SHAPES[(Math.random()*SHAPES.length)|0],c:pal[(Math.random()*pal.length)|0],
    life:1,decay:0.006+Math.random()*0.004};}
  function rain(n,pal){if(reduce)n=Math.min(n,20);const spread=(mode==="round")?0.62:0.92;
    for(let i=0;i<n;i++)parts.push(mkPart(W*(0.5+(Math.random()-0.5)*spread),-10*DPR-Math.random()*H*0.15,(Math.random()-0.5)*3*DPR,(1+Math.random()*2.2)*DPR,pal));
    if(!raf)loop();}
  function cannon(fx,n,pal){if(reduce)n=Math.min(n,14);const ox=W*fx,oy=H*1.02,dir=fx<0.5?1:-1;
    for(let i=0;i<n;i++){const ang=-Math.PI/2+dir*(0.12+Math.random()*0.5),spd=(11+Math.random()*9)*DPR;
      parts.push(mkPart(ox,oy,Math.cos(ang)*spd,Math.sin(ang)*spd,pal));}
    if(!raf)loop();}
  function burst(n,pal){if(reduce)n=Math.min(n,14);const cx=W*0.5,cy=H*(mode==="round"?0.46:0.42);
    for(let i=0;i<n;i++){const ang=Math.random()*6.28,spd=(3+Math.random()*9)*DPR;
      parts.push(mkPart(cx,cy,Math.cos(ang)*spd,Math.sin(ang)*spd-4*DPR,pal));}
    if(!raf)loop();}
  function drawShape(p){const s=p.s;
    if(p.shape==="circle"){ctx.beginPath();ctx.arc(0,0,s*0.5,0,6.2832);ctx.fill();}
    else if(p.shape==="streamer"){ctx.fillRect(-s*0.22,-s*1.4,s*0.44,s*2.8);}
    else if(p.shape==="spark"){ctx.fillRect(-s*0.62,-s*0.12,s*1.24,s*0.24);ctx.fillRect(-s*0.12,-s*0.62,s*0.24,s*1.24);}
    else ctx.fillRect(-s*0.5,-s*0.28,s,s*0.56);}
  function loop(){raf=requestAnimationFrame(loop);ctx.clearRect(0,0,W,H);
    if(mode==="round"){ctx.save();ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)/2,0,6.2832);ctx.clip();}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];
      p.vy+=p.g;p.vx*=p.drag;p.sp+=p.ss;p.x+=p.vx+Math.sin(p.sp)*p.sa;p.y+=p.vy;p.rot+=p.vr;p.life-=p.decay;
      if(p.y>H+24||p.life<=0){parts.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.4));ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;drawShape(p);ctx.restore();}
    if(mode==="round")ctx.restore();
    if(!parts.length){cancelAnimationFrame(raf);raf=null;ctx.clearRect(0,0,W,H);}}

  // ---------- compose & play（蓄力 → 爆发） ----------
  const stage=document.getElementById("stage"),lineScope=document.getElementById("lineScope"),lineState=document.getElementById("lineState"),badge=document.getElementById("badge"),tap=document.getElementById("tap"),ring=document.getElementById("ring"),flash=document.getElementById("flash");
  let endTimer=null;
  function confettiCount(){let n=(scope==="set")?70:(scope==="action")?150:260; if(state==="logged")n*=0.7; if(perf==="great")n*=1.3; if(perf==="pb")n*=1.7; return Math.round(n);}
  function duration(){let d=(scope==="set")?1500:(scope==="action")?2000:3000; if(perf==="pb")d+=400; return d;}
  function isFull(){return scope==="course";}
  // 分级：普通(本组·无表现)只柔和飘落；很棒/PB/结课 才有彩纸炮
  function bursty(){return perf!=="none"||scope!=="set";}
  function firePayload(){const pal=palette(),n=confettiCount();
    rain(Math.round(n*0.5),pal);
    if(bursty()){cannon(0.12,Math.round(n*0.5),pal);cannon(0.88,Math.round(n*0.5),pal);burst(Math.round(n*0.4),pal);}
    else burst(Math.round(n*0.35),pal);
    if(n>=200){setTimeout(()=>rain(Math.round(n*0.4),pal),700);setTimeout(()=>rain(Math.round(n*0.3),pal),1400);}}
  function play(){size();clearTimeout(endTimer);parts=[];if(raf){cancelAnimationFrame(raf);raf=null;}ctx.clearRect(0,0,W,H);
    stage.dataset.playing="true";
    const L=I18N[lang];const gold=(perf==="pb");
    lineScope.textContent=L.scope[scope]; lineState.textContent=L.state[state];
    // 复位
    lineScope.style.transition="none";lineState.style.transition="none";badge.style.transition="none";ring.style.transition="none";flash.style.transition="none";flash.style.opacity=0;
    lineScope.style.opacity=0;lineScope.style.transform="translateY(8px)";
    lineState.style.opacity=0;lineState.style.transform="scale(.55)";
    badge.style.opacity=0;badge.style.transform="translateY(8px) scale(.9)";tap.style.opacity=0;
    ring.style.borderColor="rgba(163,230,53,0)";ring.style.transform="scale(1.18)";
    if(perf==="none"){badge.style.display="none";} else {badge.style.display="block";badge.textContent=L.badge[perf];badge.className="badge"+(perf==="great"?" great":"");}
    const ant=reduce?0:(bursty()?260:170);            // 蓄力时长（大场合更久）
    // —— 蓄力：环收拢充能 + 状态词半隐放大 + 上扬音 ——
    requestAnimationFrame(()=>{
      ring.style.transition="transform "+ant+"ms cubic-bezier(.4,0,.2,1), border-color "+ant+"ms";
      ring.style.transform="scale(1.0)"; ring.style.borderColor="rgba("+(gold?"245,196,81":"163,230,53")+",.3)";
      lineState.style.transition="opacity "+ant+"ms, transform "+ant+"ms cubic-bezier(.4,0,.2,1)";
      lineState.style.opacity=0.35; lineState.style.transform="scale(.82)";
    });
    if(soundOn)riser(ant/1000);
    // —— 爆发 ——
    setTimeout(()=>burstMoment(gold),ant);
    endTimer=setTimeout(()=>{stage.dataset.playing="false";ring.style.borderColor="rgba(163,230,53,0)";},ant+duration()+400);
    renderSpec();
  }
  function burstMoment(gold){
    playSfx();                                          // 主撞击音
    firePayload();                                      // 撒花（分级：彩纸炮+飘落）
    // 状态词 overshoot 弹出
    lineState.style.transition="opacity .16s, transform .52s cubic-bezier(.2,1.5,.35,1)";
    lineState.style.opacity=1; lineState.style.transform="scale(1)";
    lineScope.style.transition="opacity .35s, transform .4s"; lineScope.style.opacity=1; lineScope.style.transform="translateY(0)";
    // 环闪亮
    ring.style.transition="border-color .5s, transform .6s";
    ring.style.borderColor="rgba("+(gold?"245,196,81":"163,230,53")+","+(scope==="course"||gold?0.9:0.5)+")";
    // 屏幕闪光
    flash.style.background="radial-gradient(circle at 50% 45%, "+(gold?"rgba(245,196,81,.6)":"rgba(163,230,53,.55)")+", rgba(0,0,0,0) 60%)";
    flash.style.transition="none"; flash.style.opacity=(scope==="course"||gold)?0.7:0.5;
    requestAnimationFrame(()=>{flash.style.transition="opacity .55s ease";flash.style.opacity=0;});
    if(perf!=="none")setTimeout(()=>{badge.style.transition="opacity .3s, transform .4s cubic-bezier(.2,1.4,.4,1)";badge.style.opacity=1;badge.style.transform="translateY(0) scale(1)";},240);
    setTimeout(()=>speak(),260);
    if(isFull())setTimeout(()=>{tap.style.opacity=1;},900);
  }

  // ---------- controls ----------
  function bindSeg(id,setter){const el=document.getElementById(id);el.querySelectorAll("button").forEach(b=>{b.onclick=()=>{el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));setter(b.dataset.v);play();};});}
  bindSeg("segLang",v=>lang=v); bindSeg("segScope",v=>scope=v); bindSeg("segState",v=>state=v); bindSeg("segPerf",v=>perf=v);
  const segMode=document.getElementById("segMode");segMode.querySelectorAll("button").forEach(b=>{b.onclick=()=>{segMode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));mode=b.dataset.v;stage.classList.toggle("round",mode==="round");stage.classList.toggle("phone",mode==="phone");document.getElementById("cap").innerHTML=mode==="round"?'设备端 · <b>466 × 466</b> 纯圆屏':'手机 App · 竖向方屏';requestAnimationFrame(()=>{size();play();});};});
  document.getElementById("replay").onclick=play;
  const tgS=document.getElementById("tgSound"),tgV=document.getElementById("tgVoice");
  tgS.onclick=()=>{soundOn=!soundOn;tgS.setAttribute("aria-pressed",soundOn);};
  tgV.onclick=()=>{voiceOn=!voiceOn;tgV.setAttribute("aria-pressed",voiceOn);};
  stage.onclick=()=>{if(stage.dataset.playing==="true"){stage.dataset.playing="false";clearTimeout(endTimer);if(raf){cancelAnimationFrame(raf);raf=null;}parts=[];ctx.clearRect(0,0,W,H);ring.style.borderColor="rgba(163,230,53,0)";if("speechSynthesis"in window)speechSynthesis.cancel();}};

  // 快捷组合（就是组合空间里的几个点，非穷举）
  const PRESETS=[["本组达标",{scope:"set",state:"done",perf:"none"}],["本组·新纪录",{scope:"set",state:"done",perf:"pb"}],["本组·未达标",{scope:"set",state:"logged",perf:"none"}],["动作完成",{scope:"action",state:"done",perf:"great"}],["整课·满贯",{scope:"course",state:"done",perf:"pb"}]];
  const pel=document.getElementById("presets");
  PRESETS.forEach(([name,cfg])=>{const b=document.createElement("button");b.textContent=name;b.onclick=()=>{scope=cfg.scope;state=cfg.state;perf=cfg.perf;syncSegs();play();};pel.appendChild(b);});
  function syncSegs(){const map={segScope:scope,segState:state,segPerf:perf};Object.entries(map).forEach(([id,v])=>{document.getElementById(id).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));});}

  function renderSpec(){const L=I18N[lang];const el=document.getElementById("spec");
    const baseName=(state==="logged")?"咚咚(暖)":(scope==="course"?"当当·和弦":"当当");
    el.innerHTML='<h3>组合结果（解耦）</h3><dl>'+
      '<dt>文字</dt><dd>三行：'+L.scope[scope]+' / <b>'+L.state[state]+'</b>（最大）'+(perf!=="none"?' / '+L.badge[perf]:'')+'</dd>'+
      '<dt>徽章</dt><dd>'+(perf==="none"?"— 无":('表现 → '+L.badge[perf]+'（独立第三行）'))+'</dd>'+
      '<dt>音效</dt><dd>基础「'+baseName+'」'+(perf==="pb"?' + 叠层「啪啪」':'')+'</dd>'+
      '<dt>人声</dt><dd>单独生成播放 · <b>不上屏</b></dd>'+
      '<dt>洒花</dt><dd>'+confettiCount()+' 粒'+(perf==="pb"?' · 金色':'')+'</dd>'+
      '<dt>形态</dt><dd>'+(isFull()?"全屏·点击继续":"overlay·自动过")+' · '+(duration()/1000).toFixed(1)+'s</dd></dl>';
  }
  window.addEventListener("resize",size);
  if("speechSynthesis"in window)speechSynthesis.onvoiceschanged=()=>{};
  size();renderSpec();
})();
</script>
